<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Infinite Rendering Example</title>
    <style>
        body { 
            margin: 0;
            overflow: hidden;
        }
        canvas { 
            display: block;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="info">
        <h2>Three.js Infinite Rendering</h2>
        <p>FPS: <span id="fps">0</span></p>
        <p>Cubes: <span id="cubeCount">0</span></p>
        <button id="addCube">Add Cube</button>
        <button id="toggleRotation">Toggle Rotation</button>
        <button id="toggleRendering">Pause Rendering</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111133);
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);
        
        // Variables to manage cubes
        const cubes = [];
        let isRotating = true;
        let isRendering = true;
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;
        
        // Add initial cube
        addCube();
        
        // Animation loop - this is the "infinite rendering"
        function animate() {
            if (isRendering) {
                // Calculate FPS
                frameCount++;
                const currentTime = performance.now();
                if (currentTime - lastTime >= 1000) {
                    fps = Math.round(frameCount * 1000 / (currentTime - lastTime));
                    document.getElementById('fps').textContent = fps;
                    frameCount = 0;
                    lastTime = currentTime;
                }
                
                // Rotate cubes if enabled
                if (isRotating) {
                    cubes.forEach(cube => {
                        cube.rotation.x += 0.01;
                        cube.rotation.y += 0.01;
                    });
                }
                
                // Render scene
                renderer.render(scene, camera);
            }
            
            // This is critical - it creates the infinite loop
            // requestAnimationFrame calls animate again as soon as the browser is ready
            requestAnimationFrame(animate);
        }
        
        // Start the animation loop
        animate();
        
        // Function to add a new cube
        function addCube() {
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshPhongMaterial({
                color: Math.random() * 0xffffff,
                shininess: 50
            });
            
            const cube = new THREE.Mesh(geometry, material);
            cube.position.x = (Math.random() - 0.5) * 5;
            cube.position.y = (Math.random() - 0.5) * 5;
            cube.position.z = (Math.random() - 0.5) * 2;
            
            scene.add(cube);
            cubes.push(cube);
            
            // Update cube count display
            document.getElementById('cubeCount').textContent = cubes.length;
        }
        
        // Event listeners for buttons
        document.getElementById('addCube').addEventListener('click', addCube);
        
        document.getElementById('toggleRotation').addEventListener('click', () => {
            isRotating = !isRotating;
            document.getElementById('toggleRotation').textContent = 
                isRotating ? "Toggle Rotation" : "Resume Rotation";
        });
        
        document.getElementById('toggleRendering').addEventListener('click', () => {
            isRendering = !isRendering;
            document.getElementById('toggleRendering').textContent = 
                isRendering ? "Pause Rendering" : "Resume Rendering";
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
